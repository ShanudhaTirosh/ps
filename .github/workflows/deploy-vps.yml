name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'shanufx community/**' # Only run when files in the Next.js app change

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.214.168.94
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Switch to root to execute the commands, as cd cannot be run with sudo directly
            sudo su - root -c "
              cd /root/shanufx-react || exit 1
              git pull origin main
              cd \"shanufx community\"
              docker-compose up -d --build
            "
