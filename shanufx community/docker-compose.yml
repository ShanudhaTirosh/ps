version: '3.9'

services:
  community:
    build: .
    container_name: shanufx-community
    ports:
      - "3000:3000"
    env_file: .env.local
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
